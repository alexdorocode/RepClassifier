
svm:
  parameters:
    C:
      min: 1e-3
      max: 100
      distribution: log_uniform  # Regularization strength
    kernel:
      values: ['linear', 'poly', 'rbf', 'sigmoid']  # Kernel type
    degree:
      values: [2, 3, 4, 5]  # Only used for 'poly' kernel
    gamma:
      values: ['scale', 'auto']  # Or define numeric range if preferred
    coef0:
      min: 0.0
      max: 1.0
      distribution: uniform  # Only used for 'poly' and 'sigmoid' kernels
    shrinking:
      values: [True, False]
    probability:
      values: [True, False]  # Whether to enable probability estimates
    tol:
      min: 1e-5
      max: 1e-2
      distribution: log_uniform  # Tolerance for stopping criteria
    cache_size:
      values: [200, 500, 1000]  # Memory size in MB
    class_weight:
      values: [null, 'balanced']  # Handling class imbalance
    max_iter:
      values: [-1, 1000, 5000]  # -1 means no limit

  base_line:
    C: 1.0
    kernel: 'poly'
    degree: 3
    gamma: 'scale'
    coef0: 0.0
    shrinking: True
    probability: False
    tol: 1e-3
    cache_size: 200
    class_weight: null
    max_iter: 1000