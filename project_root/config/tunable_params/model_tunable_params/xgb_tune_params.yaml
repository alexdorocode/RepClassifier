

xgb:
  static_parameters:
    objective: binary:logistic  # For binary classification
    use_label_encoder: False    # Disable label encoder to avoid warnings
    tree_method: auto           # Let XGBoost pick the best method (gpu_hist, hist, approx, exact)
    n_jobs: -1                  # Use all cores
    verbosity: 1                # Enable messages for debugging (0: silent, 1: warning, 2: info, 3: debug)
    booster: gbtree             # Use tree-based booster (skip gblinear)
  parameters:
    learning_rate:
      min: 0.01
      max: 0.3
      distribution: log_uniform
    n_estimators:
      values: [100, 200, 500]
    max_depth:
      values: [3, 5, 7, 9]
    min_child_weight:
      min: 1
      max: 10
      distribution: uniform
    gamma:
      min: 0.0
      max: 5.0
      distribution: uniform
    subsample:
      min: 0.5
      max: 1.0
      distribution: uniform
    colsample_bytree:
      min: 0.5
      max: 1.0
      distribution: uniform
    reg_lambda:
      min: 0.0
      max: 10.0
      distribution: uniform
    reg_alpha:
      min: 0.0
      max: 10.0
      distribution: uniform
    scale_pos_weight:
      min: 1.0
      max: 10.0
      distribution: uniform
    eval_metric:
      values: ['logloss', 'error', 'auc']  # Choose metrics appropriate for binary classification

  base_line:
    learning_rate: 0.1
    n_estimators: 100
    max_depth: 6
    min_child_weight: 1
    gamma: 0.0
    subsample: 1.0
    colsample_bytree: 1.0
    reg_lambda: 1.0
    reg_alpha: 0.0
    scale_pos_weight: 1.0
    eval_metric: 'logloss'