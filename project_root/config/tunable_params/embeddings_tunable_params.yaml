# enbeddings_tunnable_params.yaml

tune_params:
  embedding_tune_config:
    sequence_embeddings:
      esm:
        use: [true, false]
        dim:
          values: [32, 64, 128]
      prot_t5:
        use: [true, false]
        dim:
          values: [32, 64, 128]
      prost_t5:
        use: [true, false]
        dim:
          values: [32, 64, 128]

    go_embeddings:
      use: [true, false]
      autoencoded_go_embeddings:
        input_dim:
          values: [50, 100, 200, 500, 1000]
        emb_dim:
          values: [32, 64, 128]  # Autoencoded dimensions
          include_original: true  # If true, also includes input_dim as emb_dim
        aggregated_dim:
          strategies:
            - mean_pool: emb_dim
            - padding: "emb_dim * 10"
        go_categories:
          values: ["C_F", "C_F_P"]
