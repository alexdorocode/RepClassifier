method: bayes
metric:
  name: f1_score
  goal: maximize

parameters:
  hidden_layers_mode:
    values: ["quadratic_increase", "custom"]

  # For quadratic mode only
  num_hidden_layers:
    min: 1
    max: 5
    distribution: int_uniform

  # For custom mode only
  custom_layer_config:
    values:
      - {custom_hidden_layers: [512, 256, 128], num_hidden_layers: 3}
      - {custom_hidden_layers: [1024, 512, 256, 128], num_hidden_layers: 4}
      - {custom_hidden_layers: [2048, 1024, 512, 256, 128], num_hidden_layers: 5}

  dropout_rate:
    min: 0.0
    max: 0.5
    distribution: uniform

  activation_function:
    values: ["ReLU", "LeakyReLU", "ELU", "GELU"]

  use_batch_norm:
    values: [True, False]

  output_activation:
    values: [null, "Sigmoid", "Tanh"]

  initialization:
    values: [null, "xavier", "kaiming", "normal"]
