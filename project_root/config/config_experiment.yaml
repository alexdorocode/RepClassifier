# config/config_process.yaml

defaults:
  - _self_
  - config_process

experiment_definition:

  experiment_name: "protein_classification_experiment_0"

  label_col: "class"

  features_col: ['c_max_mbl', 'f_max_mbl', 'p_max_mbl', 'seq_length']

  sequence_embeddings:
    {
      "ESM": {
        "autoencoded_embeddings": True,
        "target_dim": 128
      },
      "ProtT5": {
        "autoencoded_embeddings": True,
        "target_dim": 128
      },
      "ProstT5": {
        "autoencoded_embeddings": True,
        "target_dim": 128
      }
    }

  go_embeddings:
    {
      "GeOKG": {
        "autoencoded_embeddings": True,
        "input_dim": 500,
        "emb_dim": 128,
        "aggregated_dim": 1280,
        "aggregation_strategy": "padding",
        "go_categories": "C_F"
      }
    }

  organism_discrimination_strategy:
    {
      "use_selected_organisms": null,
      "use_top_organisms": 4
    }