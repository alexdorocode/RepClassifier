# config/config_process.yaml

defaults:
  - _self_
  - config_load  # Inherits loading config
  - paths/autoencoder_paths  # Inherits autoencoder paths
  - paths/embedding_paths  # Inherits embedding paths
  - paths/autoencoded_seq_embeddings  # Inherits autoencoded sequence embeddings paths
  - paths/autoencoded_go_embeddings

features_to_process:
  columns: ["seq_length", "c_max_mbl", "f_max_mbl", "p_max_mbl"]
  nan_strategy: "fill_minus_one"  # Options: drop, fill_mean, fill_zero
  scaler_type: "standard"    # Options: standard, minmax
  trim_config:
  - column: "seq_length"
    min: -1
    max: 2000